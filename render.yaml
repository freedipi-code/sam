services:
  - type: web
    name: telegram-shop-bot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: BOT_MODE
        value: webhook
      - key: WEBHOOK_DOMAIN
        sync: false
      # Render injects RENDER_EXTERNAL_HOSTNAME automatically. The app uses it
      # whenever WEBHOOK_DOMAIN is left empty, while still allowing a custom
      # domain through the variable above.
      - key: WEBHOOK_PATH
        value: /api/telegram/webhook
      - key: WEBHOOK_SECRET
        sync: false
      - key: BTC_WALLET
        sync: false
      - key: LTC_WALLET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-shop-db-4rm0-kol
          property: connectionString

databases:
  - name: telegram-shop-db-4rm0-kol
    plan: basic-256mb
    databaseName: telegram_shop
